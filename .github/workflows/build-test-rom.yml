name: Build Test ROM

on:
  push:
    branches: [ main ]
    paths:
      - 'test-rom/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup ESP-IDF
      uses: espressif/esp-idf-ci-action@v1
      with:
        esp_idf_version: v5.5.4
        target: esp32
        path: test-rom
        
    - name: Build firmware
      run: |
        cd test-rom
        idf.py build
        
    - name: Generate merged binary
      run: |
        cd test-rom
        idf.py merge-bin
        
    - name: Upload firmware artifact
      uses: actions/upload-artifact@v4
      with:
        name: test-rom-firmware
        path: |
          test-rom/build/test_rom.bin
          test-rom/build/test_rom-merged.bin
        retention-days: 30
        
    - name: Create Release
      if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: |
          test-rom/build/test_rom.bin
          test-rom/build/test_rom-merged.bin
        token: ${{ secrets.GITHUB_TOKEN }}
        tag_name: test-rom-${{ github.run_number }}
        name: Test ROM Build #${{ github.run_number }}
        body: |
          ## Test ROM for Xiaomiao Console
          
          ### Features Tested:
          - ✅ GPIO0 Backlight control (active-low)
          - ✅ Button A ADC detection (threshold < 200)
          - ✅ Battery voltage monitoring (ADC CH6)
          - ✅ LVGL UI display
          
          ### Files:
          - `test_rom.bin` - Standard firmware
          - `test_rom-merged.bin` - Merged binary for SD card
          
          Built from commit: ${{ github.sha }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}