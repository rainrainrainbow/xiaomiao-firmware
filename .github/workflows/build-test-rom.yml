name: Build Test ROM
on:
  push:
    branches: [main]
    paths:
      - 'test-rom/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build firmware with ESP-IDF
        uses: espressif/esp-idf-ci-action@v1.1.0
        with:
          esp_idf_version: v5.5.4
          target: esp32
          path: test-rom
          command: idf.py build && idf.py merge-bin

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: test-rom-firmware
          path: |
            test-rom/build/test_rom.bin
            test-rom/build/merged-binary.bin
          retention-days: 30

      - name: Create Release
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            test-rom/build/test_rom.bin
            test-rom/build/merged-binary.bin
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: test-rom-${{ github.run_number }}
          name: Test ROM Build #${{ github.run_number }}
          body: |
            ## Test ROM for Xiaomiao Console

            ### Features Tested:
            - GPIO0 Backlight control (active-low)
            - Button A ADC detection (threshold < 200)
            - Battery voltage monitoring (ADC CH6)
            - LVGL UI display

            ### Files:
            - test_rom.bin - Standard firmware
            - merged-binary.bin - Merged binary for SD card

            Built from commit: ${{ github.sha }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
